<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>수박게임</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f4f4;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #222;
    }

    h1 {
      margin: 24px 0 12px;
    }

    /* =========================
       상단 점수 / NEXT
       ========================= */

    .info {
      width: 360px;
      max-width: calc(100vw - 20px);

      margin: 0 auto 10px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      font-size: 18px;
      font-weight: bold;
    }

    .next-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #nextFruit {
      width: 40px;
      height: 40px;

      object-fit: contain;
      border-radius: 50%;
    }

    /* =========================
       게임
       ========================= */

    #game {
      width: 360px;
      height: 600px;

      max-width: calc(100vw - 20px);

      margin: 0 auto;

      background: #fff;

      border: 3px solid #222;
      border-radius: 14px;

      overflow: hidden;

      touch-action: none;
    }

    canvas {
      display: block;
      max-width: 100%;
    }

    /* =========================
       랭킹
       ========================= */

    .ranking-box {
      width: 360px;
      max-width: calc(100vw - 20px);

      margin: 24px auto 50px;
      padding: 20px;

      background: #fff;

      border-radius: 16px;

      box-shadow:
        0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .ranking-box h2 {
      margin-top: 0;
    }

    #rankingList {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .ranking-item {
      display: grid;

      grid-template-columns:
        50px
        1fr
        80px;

      align-items: center;

      padding: 11px 4px;

      border-bottom: 1px solid #eee;
    }

    .ranking-item:last-child {
      border-bottom: none;
    }

    .ranking-rank {
      font-weight: bold;
    }

    .ranking-name {
      text-align: left;

      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .ranking-score {
      text-align: right;
      font-weight: bold;
    }

    /* =========================
       게임오버 모달
       ========================= */

    #gameOverModal {
      position: fixed;
      inset: 0;

      display: none;

      justify-content: center;
      align-items: center;

      padding: 20px;

      background: rgba(0, 0, 0, 0.65);

      z-index: 9999;
    }

    .modal-box {
      width: 320px;
      max-width: 100%;

      padding: 26px 22px;

      background: #fff;

      border-radius: 20px;

      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.3);
    }

    .modal-box h2 {
      margin: 0 0 12px;

      font-size: 30px;
    }

    .final-score-label {
      color: #777;
      font-size: 14px;
    }

    #finalScore {
      margin: 6px 0 20px;

      font-size: 32px;
      font-weight: bold;
    }

    /* =========================
       입력창
       ========================= */

    #nickname,
    #phone {
      width: 100%;

      padding: 12px;

      border: 2px solid #ddd;
      border-radius: 10px;

      outline: none;

      background: #fff;
      color: #222;

      font-size: 16px;
      text-align: center;
    }

    #phone {
      margin-top: 8px;
    }

    #nickname:focus,
    #phone:focus {
      border-color: #888;
    }

    .privacy-note {
      margin-top: 8px;

      color: #888;

      font-size: 11px;
      line-height: 1.5;

      word-break: keep-all;
    }

    /* =========================
       버튼
       ========================= */

    .modal-button {
      width: 100%;

      margin-top: 10px;
      padding: 12px;

      border: none;
      border-radius: 10px;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    #registerScore {
      background: #222;
      color: #fff;
    }

    #registerScore:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #restartButton {
      background: #eee;
      color: #222;
    }

    #registerMessage {
      min-height: 22px;

      margin-top: 10px;

      font-size: 14px;
    }

    /* =========================
       모바일
       ========================= */

    @media (max-width: 400px) {
      h1 {
        font-size: 26px;
      }

      .info {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <h1>🍉 수박게임</h1>


  <!-- 점수 / NEXT -->

  <div class="info">

    <div>
      점수:
      <span id="score">0</span>
    </div>

    <div class="next-box">
      NEXT

      <img
        id="nextFruit"
        alt="다음 형태소"
      >
    </div>

  </div>


  <!-- 게임 화면 -->

  <div id="game"></div>


  <!-- 공개 랭킹 -->

  <div class="ranking-box">

    <h2>🏆 TOP 10</h2>

    <ul id="rankingList">
      <li>랭킹 불러오는 중...</li>
    </ul>

  </div>


  <!-- =========================
       게임오버 모달
       ========================= -->

  <div id="gameOverModal">

    <div class="modal-box">

      <h2>GAME OVER</h2>

      <div class="final-score-label">
        최종 점수
      </div>

      <div id="finalScore">
        0
      </div>


      <!-- 닉네임 -->

      <input
        id="nickname"
        type="text"
        maxlength="10"
        placeholder="닉네임을 입력하세요"
        autocomplete="off"
      >


      <!-- 전화번호 -->
      <!-- 선택사항이며 버튼 밖에 있음 -->

      <input
        id="phone"
        type="tel"
        maxlength="20"
        placeholder="전화번호 (선택)"
        inputmode="tel"
        autocomplete="tel"
      >


      <!-- 개인정보 안내 -->

      <div class="privacy-note">
        전화번호는 상품 전달을 위한 연락 목적으로만 사용되며,
        입력하지 않아도 랭킹 등록이 가능합니다.
      </div>


      <!-- 랭킹 등록 버튼 -->

      <button
        id="registerScore"
        class="modal-button"
        type="button"
      >
        🏆 랭킹 등록
      </button>


      <!-- 결과 메시지 -->

      <div id="registerMessage"></div>


      <!-- 다시하기 -->

      <button
        id="restartButton"
        class="modal-button"
        type="button"
      >
        다시하기
      </button>

    </div>

  </div>


  <!-- Matter.js -->

  <script
    src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"
  ></script>


  <!-- Supabase -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <!-- 프로젝트 JS / 캐시 방지 -->

 <script src="./supabase.js?v=20260930-21"></script>
<script src="./game.js?v=20260930-21"></script>
</body>
</html>
