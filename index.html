<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>수박게임</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3f3f3;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 20px 0 10px;
    }

    .info {
      width: 360px;
      margin: 0 auto 10px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      font-size: 18px;
      font-weight: bold;
    }

    .next-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #nextFruit {
      width: 40px;
      height: 40px;
      object-fit: contain;
      border-radius: 50%;
    }

    #game {
      width: 360px;
      height: 600px;

      margin: auto;

      background: white;

      border: 3px solid #222;
      border-radius: 12px;

      overflow: hidden;

      touch-action: none;
    }

    canvas {
      display: block;
    }

    /* ========================
       게임오버 팝업
    ======================== */

    #gameOverModal {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background: rgba(0, 0, 0, 0.65);

      display: none;

      justify-content: center;
      align-items: center;

      z-index: 1000;
    }

    .modal-box {
      width: 320px;

      background: white;

      padding: 25px;

      border-radius: 20px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .modal-box h2 {
      margin-top: 0;
      font-size: 30px;
    }

    #finalScore {
      font-size: 28px;
      font-weight: bold;

      margin: 15px 0 20px;
    }

    #nickname {
      width: 100%;

      padding: 12px;

      border: 2px solid #ddd;
      border-radius: 10px;

      font-size: 16px;

      text-align: center;

      outline: none;
    }

    #nickname:focus {
      border-color: #555;
    }

    .modal-button {
      width: 100%;

      margin-top: 10px;
      padding: 12px;

      border: none;
      border-radius: 10px;

      cursor: pointer;

      font-size: 16px;
      font-weight: bold;
    }

    #registerScore {
      background: #222;
      color: white;
    }

    #restartButton {
      background: #eeeeee;
      color: #222;
    }

    #registerMessage {
      min-height: 20px;

      margin-top: 10px;

      font-size: 14px;
    }

    /* ========================
       랭킹
    ======================== */

    .ranking-box {
      width: 360px;

      margin: 20px auto 50px;

      background: white;

      padding: 18px;

      border-radius: 16px;

      text-align: left;
    }

    .ranking-box h2 {
      text-align: center;

      margin-top: 0;
    }

    #rankingList {
      margin: 0;
      padding: 0;

      list-style: none;
    }

    .ranking-item {
      display: grid;

      grid-template-columns:
        45px 1fr 80px;

      padding: 10px 5px;

      border-bottom: 1px solid #eee;

      align-items: center;
    }

    .ranking-rank {
      font-weight: bold;
    }

    .ranking-name {
      overflow: hidden;

      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ranking-score {
      text-align: right;

      font-weight: bold;
    }

    @media (max-width: 400px) {
      #game,
      .info,
      .ranking-box {
        width: calc(100vw - 20px);
        max-width: 360px;
      }
    }
  </style>
</head>

<body>

  <h1>🍉 수박게임</h1>

  <div class="info">

    <div>
      점수:
      <span id="score">0</span>
    </div>

    <div class="next-box">
      NEXT
      <img
        id="nextFruit"
        alt="다음 공"
      >
    </div>

  </div>

  <div id="game"></div>

  <div class="ranking-box">

    <h2>🏆 TOP 10</h2>

    <ul id="rankingList">
      <li>랭킹 불러오는 중...</li>
    </ul>

  </div>

  <!-- 게임오버 팝업 -->
  <div id="gameOverModal">

    <div class="modal-box">

      <h2>GAME OVER</h2>

      <div>
        최종 점수
      </div>

      <div id="finalScore">
        0
      </div>

      <input
        id="nickname"
        type="text"
        maxlength="10"
        placeholder="닉네임 입력"
        autocomplete="off"
      >

      <button
        id="registerScore"
        class="modal-button"
      >
        랭킹 등록
      </button>

      <div id="registerMessage"></div>

      <button
        id="restartButton"
        class="modal-button"
      >
        다시하기
      </button>

    </div>

  </div>

  <!-- Matter.js -->
  <script
    src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"
  ></script>

  <!-- Supabase -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <!-- DB 연결 -->
  <script src="./supabase.js"></script>

  <!-- 게임 -->
  <script src="./game.js"></script>

</body>
</html>
