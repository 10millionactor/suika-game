<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>수박게임</title>

  <style>
   .info {
  width: 360px;
  margin: 0 auto 10px;

  display: flex;
  justify-content: space-between;
  align-items: center;

  font-size: 18px;
  font-weight: bold;
}

.next-box {
  display: flex;
  align-items: center;
  gap: 8px;
}

#nextFruit {
  width: 25px;
  height: 25px;
  border-radius: 50%;
}

#game {
  width: 360px;
  height: 600px;
  margin: 0 auto;
  touch-action: none;
}
      background: white;
      border: 3px solid #222;
      border-radius: 12px;
    }
  </style>
</head>

<body>

 <h1>🍉 수박게임</h1>

<div class="info">
  <div>
    점수:
    <span id="score">0</span>
  </div>

  <div class="next-box">
    NEXT
  <img id="nextFruit">
  </div>
</div>

<div id="game"></div>
  
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
<script src="game.js"></script>

</html>
