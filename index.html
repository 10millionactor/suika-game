<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>수박게임</title>

  <style>
    body {
      margin: 0;
      background: #f3f3f3;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 24px;
      margin-bottom: 12px;
    }

    .info {
      width: 360px;
      margin: 0 auto 10px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      font-size: 18px;
      font-weight: bold;
    }

    .next-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #nextFruit {
      width: 40px;
      height: 40px;
      object-fit: contain;
      border-radius: 50%;
    }

    #game {
      width: 360px;
      height: 600px;

      margin: 0 auto 30px;

      background: white;

      border: 3px solid #222;
      border-radius: 12px;

      overflow: hidden;

      touch-action: none;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>

  <h1>🍉 수박게임</h1>

  <div class="info">

    <div>
      점수:
      <span id="score">0</span>
    </div>

    <div class="next-box">
      NEXT
      <img id="nextFruit" alt="다음 공">
    </div>

  </div>

  <div id="game"></div>

  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
  <script src="./game.js"></script>

</body>
</html>
